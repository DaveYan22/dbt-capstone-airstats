# ClickHouse + dbt Core for the AirStats capstone (Snowflake in the original assignment).
#
#   docker compose up -d --wait          # start ClickHouse; first start loads the 3 OurAirports tables
#   docker compose run --rm dbt debug    # dbt Core inside a container, from ./airstats
#   docker compose down / down -v        # stop (keeps data) / stop + wipe data

name: airstats

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: clickhouse-airstats
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: dbt
      CLICKHOUSE_PASSWORD: dbt_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8126:8123"   # HTTP (airbnb-for-me uses 8125, flights uses 8124)
      - "9003:9000"   # native TCP
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      # ClickHouse's file() table function only reads from user_files_path
      - ./ourairports-data:/var/lib/clickhouse/user_files/raw-data:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user dbt --password dbt_password -q \"SELECT throwIf(count() = 0) FROM system.databases WHERE name = 'dev'\""]
      interval: 5s
      timeout: 5s
      retries: 60

  dbt:
    build: ./docker/dbt
    image: airstats-dbt:1.11
    profiles: ["cli"]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CH_HOST: clickhouse
      CH_PORT: 8123
    volumes:
      - .:/usr/app   # repo root; dbt_project.yml etc. live in the airstats/ subfolder within it
    ports:
      - "8081:8080"   # dbt docs serve

volumes:
  clickhouse_data:
